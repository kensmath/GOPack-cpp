name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            cmake_extra_args: ""
          - os: macos-latest
            name: macos-universal
            # Builds one universal ("fat") binary containing both Apple
            # Silicon (arm64) and Intel (x86_64) code in the same
            # libgopack_jni.dylib/gopack, so downstream consumers (e.g. a
            # Java jar bundling native libraries) only need to ship a
            # single macOS artifact instead of picking arm64 vs x64 at
            # runtime. Works from a single arm64 runner because Apple's
            # clang cross-compiles for x86_64 regardless of host
            # architecture; Eigen is header-only so there's nothing
            # architecture-specific to worry about on that side.
            # Quoted so the ';' survives bash's parsing as part of the
            # -DCMAKE_OSX_ARCHITECTURES value instead of being read as a
            # command separator (which silently truncated this to
            # "...=arm64" and then tried to run a second, bogus command
            # literally named "x86_64" -- exit code 127, "command not found").
            cmake_extra_args: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK (for the JNI target)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy build\cli\Release\gopack.exe dist\ 2>NUL || copy build\cli\gopack.exe dist\
          copy build\jni\cpp\Release\gopack_jni.dll dist\ 2>NUL || copy build\jni\cpp\gopack_jni.dll dist\
        shell: cmd
        continue-on-error: true

      - name: Package artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp build/cli/gopack dist/ || true
          cp build/jni/cpp/libgopack_jni.dylib dist/ || true
          file dist/* || true
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gopack-cpp-${{ matrix.name }}
          path: dist/
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build inside an old-glibc container (manylinux2014 = CentOS 7,
      # glibc 2.17 -- the same baseline the Python packaging ecosystem uses
      # so a wheel/.so "runs on every mainstream Linux from the last
      # decade") rather than directly on the ubuntu-latest host, whose own
      # glibc is much newer than most users' actual machines: a .so linked
      # against that would refuse to load elsewhere with a
      # "version `GLIBC_2.3x' not found" error. This step wraps only the
      # configure/build/test commands in `docker run`, not the whole job
      # (i.e. not GitHub Actions' own `container:` key) -- manylinux2014's
      # glibc is too old to run the Node.js runtime GitHub's own actions
      # (checkout/upload-artifact) need, so those stay on the normal
      # ubuntu-latest host and only the actual compilation happens inside
      # the old image. `ls /opt/rh` is printed before enabling a devtoolset
      # purely as a diagnostic: if the exact devtoolset version below ever
      # stops existing in the upstream image, the log shows what's actually
      # available instead of just failing with "no such file or directory".
      - name: Configure, build, and test inside manylinux2014 (old-glibc baseline)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -c '
              set -e
              yum install -y -q git make java-11-openjdk-devel
              ls /opt/rh
              source /opt/rh/devtoolset-10/enable
              gcc --version
              curl -fsSL -o /tmp/cmake.tar.gz \
                https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz
              tar -xzf /tmp/cmake.tar.gz -C /opt
              export PATH="/opt/cmake-3.28.3-linux-x86_64/bin:$PATH"
              cmake --version
              export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
              echo "JAVA_HOME=$JAVA_HOME"
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
              cmake --build build --config Release --parallel
              ctest --test-dir build -C Release --output-on-failure
              chown -R "$(stat -c "%u:%g" /work)" /work/build
            '

      - name: Package artifacts (Linux)
        run: |
          mkdir -p dist
          cp build/cli/gopack dist/ || true
          cp build/jni/cpp/libgopack_jni.so dist/ || true
          file dist/* || true
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gopack-cpp-linux-x64
          path: dist/
          if-no-files-found: warn
